<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burning Flame 360°</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
/* VOICE: shop counter, loud and warm, but out of the product's way
   IDEA: a product-photography turntable; the bottle is the page
   PICTURE: the photoreal 360° bottle, filling the stage
   COLOUR and TYPE: studio sand from the renders, flavour colour as accent, ink #1f120e; Archivo heavy italic for names
   LAYOUT: stage left/top, flavour + controls column right; stacks on phones */
:root{color-scheme:light;--bgc:#f5b21b;--ink:#1f120e;--cream:#fdf5e0;--acc:#ed622b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
.wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);min-height:100vh}
.stage{position:relative;min-height:100vh;cursor:grab;user-select:none;touch-action:pan-y;overflow:hidden;background:var(--bgc);transition:background .3s}
.stage:active{cursor:grabbing}
.frame{position:absolute;inset:4% 0 2%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 55%;pointer-events:none}
.dial{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;background:rgba(253,245,224,.88);padding:4px 14px 4px 6px;border-radius:30px;white-space:nowrap}
.dial svg{width:34px;height:34px}
.side{max-width:620px;padding:clamp(24px,5vw,64px) clamp(20px,4vw,56px);display:flex;flex-direction:column;justify-content:center;gap:22px}
.logo{width:200px}
h1{font:italic 900 clamp(34px,5vw,52px)/1.02 Archivo,sans-serif;margin:0;color:var(--acc);text-wrap:balance}
.sub{margin:6px 0 0;font-size:15px;opacity:.8}
.heat{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
.heat i{width:18px;height:9px;border-radius:9px;border:2px solid var(--acc)}
.heat i.on{background:var(--acc)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tab{border:2px solid transparent;border-radius:14px;background:#f3e8cc;padding:8px 6px 10px;cursor:pointer;font:700 14px Archivo,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px}
.tab img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px}
.tab[aria-pressed=true]{border-color:var(--c);background:var(--cream)}
.tab:focus-visible,.ctl button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.ctl button{font:700 14px Archivo,sans-serif;min-height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.ctl button[aria-pressed=true]{background:var(--ink);color:var(--cream)}
input[type=range]{width:100%;accent-color:var(--acc);height:32px}
.bgs{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700}.bgs button{width:44px;height:44px;border-radius:50%;border:2px solid rgba(31,18,14,.25);cursor:pointer;background:var(--c)}.bgs button[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:2px}.fine{font-size:13px;opacity:.65;margin:0}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.stage{min-height:0;aspect-ratio:4/5;max-height:72vh;width:100%}.side{max-width:620px;padding-top:8px;justify-content:flex-start}.logo{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const N=FR.original.length;let fl=0,pos=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,raf=0,last=0;

const tabs=document.getElementById('tabs');

function show(){
  const p=((pos%N)+N)%N,i=Math.round(p)%N,f=FL[fl].id;
  if(A.dataset.k!==f+i){A.src=FR[f][i];A.dataset.k=f+i}
  const deg=Math.round(p/N*360)%360;document.getElementById('deg').textContent=deg+'°';
  const a=deg/360*2*Math.PI,x=20+16*Math.sin(a),y=20-16*Math.cos(a);
  document.getElementById('arc').setAttribute('d',deg<1?'':`M20 4 A16 16 0 ${deg>180?1:0} 1 ${x.toFixed(2)} ${y.toFixed(2)}`);
  slider.value=i;
}
function setFl(i){fl=i;const f=FL[i];document.documentElement.style.setProperty('--acc',f.col);
  document.getElementById('name').textContent=f.name;
  document.getElementById('heat').innerHTML=[0,1,2].map(k=>`<i class="${k<f.heat?'on':''}"></i>`).join('');

function loop(ts){if(!last)last=ts;const dt=(ts-last)/1000;last=ts;if(playing){pos+=dt*N/7;show()}raf=requestAnimationFrame(loop)}

tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)setFl(+b.dataset.i)});

document.getElementById('back').onclick=()=>{setPlay(false);pos=N/2;show()};
slider.oninput=()=>{setPlay(false);pos=+slider.value;show()};
const st=document.getElementById('stage');let drag=null;
st.addEventListener('pointerdown',e=>{drag={x:e.clientX,p:pos};setPlay(false);st.setPointerCapture(e.pointerId)});

const end=()=>{if(drag){drag=null;pos=Math.round(pos);show()}};
st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'){setPlay(false);pos=Math.round(pos)+1;show()}if(e.key==='ArrowLeft'){setPlay(false);pos=Math.round(pos)-1;show()}
  if(['1','2','3'].includes(e.key))setFl(+e.key-1)});
const BG=[['Marigold','#f5b21b'],['Cream','#fdf5e0'],['Teal','#1f6f6b'],['Ink','#1f120e'],['Sky','#9fd3e6']];
const bgs=document.getElementById('bgs');bgs.innerHTML='<span>Backdrop</span>'+BG.map((b,i)=>`<button style="--c:${b[1]}" data-i="${i}" title="${b[0]}" aria-label="${b[0]} backdrop" aria-pressed="${i===0}"></button>`).join('');
bgs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.documentElement.style.setProperty('--bgc',BG[+b.dataset.i][1]);bgs.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
// preload
const keep=[];Object.values(FR).flat().forEach(s=>{const im=new Image();im.decoding='sync';im.src=s;keep.push(im)});slider.max=N-1;
setFl(0);setPlay(playing);raf=requestAnimationFrame(loop);
}
